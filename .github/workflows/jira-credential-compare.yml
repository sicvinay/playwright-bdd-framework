name: Compare Jira CI credentials

on:
  workflow_dispatch:

permissions: {}

jobs:
  compare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Compare Jira credentials without displaying values
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_CI_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_CI_TOKEN }}
          JIRA_COMPARISON: ${{ secrets.JIRA_CI_COMPARISON }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import hmac
          import os
          import re

          reference = os.environ["JIRA_COMPARISON"].strip()
          if not re.fullmatch(r"[0-9a-fA-F]{64}(?::[0-9a-fA-F]{64}){2}", reference):
              raise SystemExit("Missing or invalid JIRA_CI_COMPARISON secret")
          key_hex, expected_email, expected_token = reference.split(":")
          key = bytes.fromhex(key_hex)

          all_match = True
          for label, env_name, expected in (
              ("Jira email", "JIRA_EMAIL", expected_email),
              ("Jira token", "JIRA_TOKEN", expected_token),
          ):
              value = os.environ[env_name].strip()
              actual = hmac.digest(key, value.encode("utf-8"), hashlib.sha256)
              matches = bool(value) and hmac.compare_digest(actual, bytes.fromhex(expected))
              print(f"{label}: {'MATCH' if matches else 'MISMATCH'}")
              all_match = all_match and matches

          raise SystemExit(0 if all_match else 1)
          PY
