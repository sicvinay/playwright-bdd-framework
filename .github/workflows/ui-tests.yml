name: UI Automation Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  ui-tests:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      BASE_URL: https://www.saucedemo.com
      USERNAME: ${{ secrets.SAUCE_USERNAME }}
      PASSWORD: ${{ secrets.SAUCE_PASSWORD }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Behave tests
        run: |
          mkdir -p reports/junit
          behave --junit --junit-directory reports/junit

      - name: Generate test summary
        if: ${{ always() }}
        run: |
          python utils/ci_summary.py > reports/junit/summary.json

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-automation-test-results
          path: reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Send Slack notification
        if: ${{ always() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          WORKFLOW: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = "success" ]; then
            EMOJI="🟢"
            MESSAGE="UI Automation Tests Passed"
          else
            EMOJI="🔴"
            MESSAGE="UI Automation Tests Failed"
          fi

          payload=$(jq -n \
            --arg text "$EMOJI $MESSAGE\nRepository: $REPOSITORY\nBranch: $BRANCH\nWorkflow: $WORKFLOW\nRun: #$RUN_NUMBER\nRun URL: $RUN_URL" \
            '{text: $text}')

          curl -X POST \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
