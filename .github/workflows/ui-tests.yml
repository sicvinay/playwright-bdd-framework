name: UI Automation Tests

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'

  pull_request:
    branches:
      - main

  # Daily at 07:00 IST (01:30 UTC); scheduled workflows run from the default branch.
  schedule:
    - cron: '30 1 * * *'

  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Behave test suite to execute'
        required: true
        type: choice
        default: regression
        options:
          - smoke
          - sanity
          - regression
          - negative
          - all
      target_environment:
        description: 'Environment to test (dev/staging require a configured URL)'
        required: true
        type: choice
        default: qa
        options:
          - qa
          - dev
          - staging

jobs:
  ui-tests:

    runs-on: ubuntu-24.04

    timeout-minutes: 30

    concurrency:
      group: ui-tests-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'scheduled-regression' || github.ref }}
      cancel-in-progress: false

    env:
      TARGET_ENV: ${{ inputs.target_environment || 'qa' }}
      REQUESTED_SUITE: ${{ inputs.test_suite || 'auto' }}
      QA_BASE_URL: https://www.saucedemo.com
      DEV_BASE_URL: ${{ vars.DEV_BASE_URL }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      QA_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      QA_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
      DEV_USERNAME: ${{ secrets.DEV_APP_USERNAME }}
      DEV_PASSWORD: ${{ secrets.DEV_APP_PASSWORD }}
      STAGING_USERNAME: ${{ secrets.STAGING_APP_USERNAME }}
      STAGING_PASSWORD: ${{ secrets.STAGING_APP_PASSWORD }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Java for Allure CLI
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Allure CLI
        run: npm install --global allure-commandline@2.34.1

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Resolve target environment
        shell: bash
        run: |
          case "$TARGET_ENV" in
            qa) BASE_URL="$QA_BASE_URL"; APP_USERNAME="$QA_USERNAME"; APP_PASSWORD="$QA_PASSWORD" ;;
            dev) BASE_URL="$DEV_BASE_URL"; APP_USERNAME="$DEV_USERNAME"; APP_PASSWORD="$DEV_PASSWORD" ;;
            staging) BASE_URL="$STAGING_BASE_URL"; APP_USERNAME="$STAGING_USERNAME"; APP_PASSWORD="$STAGING_PASSWORD" ;;
            *) echo "Unsupported target environment: $TARGET_ENV" >&2; exit 1 ;;
          esac
          if [[ -z "$BASE_URL" || ! "$BASE_URL" =~ ^https?:// ]]; then
            echo "No valid URL configured for $TARGET_ENV. Configure the corresponding repository variable." >&2
            exit 1
          fi
          if [[ -z "$APP_USERNAME" || -z "$APP_PASSWORD" ]]; then
            echo "Missing application credentials for $TARGET_ENV. Configure the corresponding Actions secrets." >&2
            exit 1
          fi
          echo "::add-mask::$APP_USERNAME"
          echo "::add-mask::$APP_PASSWORD"
          echo "BASE_URL=$BASE_URL" >> "$GITHUB_ENV"
          echo "APP_USERNAME=$APP_USERNAME" >> "$GITHUB_ENV"
          echo "APP_PASSWORD=$APP_PASSWORD" >> "$GITHUB_ENV"
          echo "Selected target: $TARGET_ENV"

      - name: Select test suite
        shell: bash
        run: |
          SUITE="$REQUESTED_SUITE"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            SUITE="regression"
          elif [[ "$SUITE" == "auto" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then SUITE="smoke"; else SUITE="regression"; fi
          fi
          case "$SUITE" in
            smoke|sanity|regression|negative|all) ;;
            *) echo "Unsupported test suite: $SUITE" >&2; exit 1 ;;
          esac
          echo "TEST_SUITE=$SUITE" >> "$GITHUB_ENV"
          echo "Selected suite: $SUITE"

      - name: Run Behave tests
        id: behave_tests
        shell: bash
        run: |
          mkdir -p reports/allure-results
          printf 'Environment=%s\nBase URL=%s\nTest suite=%s\n' "$TARGET_ENV" "$BASE_URL" "$TEST_SUITE" > reports/allure-results/environment.properties
          printf 'Target: %s\nSuite: %s\nBranch: %s\nRun: %s\n' "$TARGET_ENV" "$TEST_SUITE" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" > reports/run-metadata.txt
          if [[ "$TEST_SUITE" == "all" ]]; then
            behave -f allure_behave.formatter:AllureFormatter -o reports/allure-results -f pretty
          else
            behave --tags="@$TEST_SUITE" -f allure_behave.formatter:AllureFormatter -o reports/allure-results -f pretty
          fi

      - name: Generate Allure HTML report
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -d reports/allure-results ]] && compgen -G 'reports/allure-results/*-result.json' > /dev/null; then
            allure generate reports/allure-results --clean -o reports/allure-report
          else
            echo "No Allure scenario results available; skipping HTML generation."
          fi

      - name: Add execution summary
        if: ${{ always() }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.behave_tests.outcome }}
        run: |
          {
            echo '## UI automation execution'
            echo "- Environment: ${TARGET_ENV:-not resolved}"
            echo "- Suite: ${TEST_SUITE:-not selected}"
            echo "- Behave outcome: ${TEST_OUTCOME}"
            echo '- Artifacts: screenshots, videos, traces, logs, Allure results and HTML report (when generated)'
            echo '- Retention: 14 days'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-automation-test-results
          path: reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Send Slack notification
        if: ${{ always() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          WORKFLOW: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = "success" ]; then
            EMOJI="🟢"
            MESSAGE="UI Automation Tests Passed"
          else
            EMOJI="🔴"
            MESSAGE="UI Automation Tests Failed"
          fi

          payload=$(jq -n \
            --arg text "$EMOJI $MESSAGE\nRepository: $REPOSITORY\nBranch: $BRANCH\nWorkflow: $WORKFLOW\nRun: #$RUN_NUMBER\nRun URL: $RUN_URL" \
            '{text: $text}')

          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Slack webhook not configured; skipping notification."
            exit 0
          fi

          curl -X POST \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
