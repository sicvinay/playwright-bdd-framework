name: UI Automation Tests

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'

  pull_request:
    branches:
      - main

  # Daily at 07:00 IST (01:30 UTC); scheduled workflows run from the default branch.
  schedule:
    - cron: '30 1 * * *'

  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Behave test suite to execute'
        required: true
        type: choice
        default: regression
        options:
          - smoke
          - sanity
          - regression
          - negative
          - all
      browser:
        description: 'Browser engine (all runs each browser in a separate job)'
        required: true
        type: choice
        default: chromium
        options:
          - chromium
          - firefox
          - webkit
          - all
      target_environment:
        description: 'Environment to test (dev/staging require a configured URL)'
        required: true
        type: choice
        default: qa
        options:
          - qa
          - dev
          - staging

jobs:
  ui-tests:

    runs-on: ubuntu-24.04

    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.browser == 'all' && '["chromium","firefox","webkit"]' || format('["{0}"]', inputs.browser || 'chromium')) }}
        shard: [0, 1]

    concurrency:
      group: ui-tests-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'scheduled-regression' || github.ref }}-${{ matrix.browser }}-${{ matrix.shard }}
      cancel-in-progress: false

    env:
      TARGET_ENV: ${{ inputs.target_environment || 'qa' }}
      BROWSER: ${{ matrix.browser }}
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_COUNT: 2
      REQUESTED_SUITE: ${{ inputs.test_suite || 'auto' }}
      QA_BASE_URL: https://www.saucedemo.com
      DEV_BASE_URL: ${{ vars.DEV_BASE_URL }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      QA_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      QA_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
      DEV_USERNAME: ${{ secrets.DEV_APP_USERNAME }}
      DEV_PASSWORD: ${{ secrets.DEV_APP_PASSWORD }}
      STAGING_USERNAME: ${{ secrets.STAGING_APP_USERNAME }}
      STAGING_PASSWORD: ${{ secrets.STAGING_APP_PASSWORD }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Java for Allure CLI
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Allure CLI
        run: npm install --global allure-commandline@2.34.1

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps "$BROWSER"

      - name: Resolve target environment
        shell: bash
        run: |
          case "$TARGET_ENV" in
            qa) BASE_URL="$QA_BASE_URL"; APP_USERNAME="$QA_USERNAME"; APP_PASSWORD="$QA_PASSWORD" ;;
            dev) BASE_URL="$DEV_BASE_URL"; APP_USERNAME="$DEV_USERNAME"; APP_PASSWORD="$DEV_PASSWORD" ;;
            staging) BASE_URL="$STAGING_BASE_URL"; APP_USERNAME="$STAGING_USERNAME"; APP_PASSWORD="$STAGING_PASSWORD" ;;
            *) echo "Unsupported target environment: $TARGET_ENV" >&2; exit 1 ;;
          esac
          if [[ -z "$BASE_URL" || ! "$BASE_URL" =~ ^https?:// ]]; then
            echo "No valid URL configured for $TARGET_ENV. Configure the corresponding repository variable." >&2
            exit 1
          fi
          if [[ -z "$APP_USERNAME" || -z "$APP_PASSWORD" ]]; then
            echo "Missing application credentials for $TARGET_ENV. Configure the corresponding Actions secrets." >&2
            exit 1
          fi
          echo "::add-mask::$APP_USERNAME"
          echo "::add-mask::$APP_PASSWORD"
          echo "BASE_URL=$BASE_URL" >> "$GITHUB_ENV"
          echo "APP_USERNAME=$APP_USERNAME" >> "$GITHUB_ENV"
          echo "APP_PASSWORD=$APP_PASSWORD" >> "$GITHUB_ENV"
          echo "Selected target: $TARGET_ENV"

      - name: Select test suite
        shell: bash
        run: |
          SUITE="$REQUESTED_SUITE"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            SUITE="regression"
          elif [[ "$SUITE" == "auto" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then SUITE="smoke"; else SUITE="regression"; fi
          fi
          case "$SUITE" in
            smoke|sanity|regression|negative|all) ;;
            *) echo "Unsupported test suite: $SUITE" >&2; exit 1 ;;
          esac
          echo "TEST_SUITE=$SUITE" >> "$GITHUB_ENV"
          echo "Selected suite: $SUITE"

      - name: Run Behave tests
        id: behave_tests
        env:
          JIRA_DEFECTS_ENABLED: ${{ vars.JIRA_DEFECTS_ENABLED }}
        shell: bash
        run: |
          mkdir -p reports/allure-results
          printf 'Environment=%s\nBase URL=%s\nTest suite=%s\nBrowser=%s\nShard=%s/%s\n' "$TARGET_ENV" "$BASE_URL" "$TEST_SUITE" "$BROWSER" "$SHARD_INDEX" "$SHARD_COUNT" > reports/allure-results/environment.properties
          printf 'Target: %s\nSuite: %s\nBrowser: %s\nShard: %s/%s\nBranch: %s\nRun: %s\n' "$TARGET_ENV" "$TEST_SUITE" "$BROWSER" "$SHARD_INDEX" "$SHARD_COUNT" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" > reports/run-metadata.txt
          mapfile -t FEATURES < <(find features -maxdepth 1 -type f -name '*.feature' | sort)
          SELECTED=()
          for i in "${!FEATURES[@]}"; do
            if (( i % SHARD_COUNT == SHARD_INDEX )); then
              SELECTED+=("${FEATURES[i]}")
            fi
          done
          if (( ${#SELECTED[@]} == 0 )); then
            echo "No feature files assigned to shard $SHARD_INDEX; nothing to execute."
            exit 0
          fi
          printf 'Shard %s/%s executes: %s\\n' "$SHARD_INDEX" "$SHARD_COUNT" "${SELECTED[*]}"
          TAGS=()
          if [[ "$TEST_SUITE" != "all" ]]; then
            TAGS=(--tags="@$TEST_SUITE")
          fi
          outcome=0
          CI_ASSERTIONS_FILE=reports/ci-assertions.jsonl \
            behave "${SELECTED[@]}" "${TAGS[@]}" -f allure_behave.formatter:AllureFormatter -o reports/allure-results -f pretty || outcome=$?
          if [[ "$outcome" == 1 && -s reports/ci-assertions.jsonl &&
                "$GITHUB_EVENT_NAME" == schedule && "${JIRA_DEFECTS_ENABLED:-}" == true ]]; then
            confirmation=0
            CI_ASSERTIONS_FILE=reports/ci-confirmed-assertions.jsonl behave "${SELECTED[@]}" "${TAGS[@]}" || confirmation=$?
            case "$confirmation" in
              0) echo "retry=passed" >> "$GITHUB_OUTPUT" ;;
              1) echo "retry=failed" >> "$GITHUB_OUTPUT" ;;
              *) echo "retry=error" >> "$GITHUB_OUTPUT" ;;
            esac
            if [[ "$confirmation" != 1 ]]; then
              rm -f reports/ci-confirmed-assertions.jsonl
            fi
          fi
          exit "$outcome"

      - name: Generate Allure HTML report
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -d reports/allure-results ]] && compgen -G 'reports/allure-results/*-result.json' > /dev/null; then
            allure generate reports/allure-results --clean -o reports/allure-report
          else
            echo "No Allure scenario results available; skipping HTML generation."
          fi

      - name: Add execution summary
        if: ${{ always() }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.behave_tests.outcome }}
        run: |
          {
            echo '## UI automation execution'
            echo "- Environment: ${TARGET_ENV:-not resolved}"
            echo "- Suite: ${TEST_SUITE:-not selected}"
            echo "- Browser: ${BROWSER:-not selected}"
            echo "- Shard: ${SHARD_INDEX:-unknown}/${SHARD_COUNT:-unknown}"
            echo "- Behave outcome: ${TEST_OUTCOME}"
            echo '- Artifacts: screenshots, videos, traces, logs, Allure results and HTML report (when generated)'
            echo '- Retention: 14 days'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        id: upload_evidence
        uses: actions/upload-artifact@v4
        with:
          name: ui-automation-test-results-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn


      - name: Collect Jira-safe result manifest
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          TEST_OUTCOME: ${{ steps.behave_tests.outcome }}
          EVIDENCE_URL: ${{ steps.upload_evidence.outputs.artifact-url }}
          RETRY_OUTCOME: ${{ steps.behave_tests.outputs.retry || 'not run' }}
        run: python scripts/jira_regression.py collect

      - name: Upload Jira result manifest
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jira-result-${{ matrix.browser }}-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: jira-result.json
          retention-days: 14

  jira-report:
    needs: ui-tests
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.JIRA_REPORTING_ENABLED == 'true' }}
    outputs:
      bugs: ${{ steps.publish.outputs.bugs }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    concurrency:
      group: jira-regression-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: jira-result-*-attempt-${{ github.run_attempt }}
          path: jira-results

      - name: Publish results to Jira
        id: publish
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_CI_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_CI_TOKEN }}
          JIRA_CLOUD_ID: ${{ vars.JIRA_CLOUD_ID }}
          JIRA_RESULTS_ISSUE: ${{ vars.JIRA_RESULTS_ISSUE }}
          JIRA_DEFECTS_ENABLED: ${{ vars.JIRA_DEFECTS_ENABLED }}
          MATRIX_RESULT: ${{ needs.ui-tests.result }}
          EXPECTED_SHARDS: ${{ inputs.browser == 'all' && '6' || '2' }}
          TARGET_ENV: ${{ inputs.target_environment || 'qa' }}
        run: python scripts/jira_regression.py publish

  slack-summary:
    needs: [ui-tests, jira-report]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: jira-result-*-attempt-${{ github.run_attempt }}
          path: jira-results

      - name: Read GitHub Actions job results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" > ci-jobs.json || rm -f ci-jobs.json

      - name: Publish Slack run summary
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MATRIX_RESULT: ${{ needs.ui-tests.result }}
          JIRA_RESULT: ${{ needs.jira-report.result }}
          JIRA_BUGS: ${{ needs.jira-report.outputs.bugs }}
          JIRA_RESULTS_ISSUE: ${{ vars.JIRA_RESULTS_ISSUE }}
          JIRA_SITE_URL: ${{ vars.JIRA_SITE_URL }}
          EXPECTED_SHARDS: ${{ inputs.browser == 'all' && '6' || '2' }}
          TARGET_ENV: ${{ inputs.target_environment || 'qa' }}
        run: python scripts/slack_ci_summary.py
